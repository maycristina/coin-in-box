<!doctype html>
<html lang="pt-BR">

<head>
  <!-- A apresentação mudou de /apresentacao/ para /sobre/. Esta página só redireciona,
       traduzindo a âncora antiga por número (#s2) para o nome da seção (#incomuns). -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Coin in box</title>
  <link rel="canonical" href="https://coininbox.cc/sobre/">
  <script>
    (function () {
      var nomes = ['', 'explorar', 'incomuns', 'tempo', 'caixa'];
      var m = /^#s(\d+)$/.exec(location.hash);
      var ancora = m ? (nomes[+m[1]] ? '#' + nomes[+m[1]] : '') : location.hash;
      location.replace('/sobre/' + ancora);
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=/sobre/">
</head>

<body>
  <p><a href="/sobre/">coininbox.cc/sobre</a></p>
</body>

</html>
